# Compila la versión FINAL firmada para subir a Google Play (.aab).
# Necesita estos secretos en Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64   la llave de subida (.jks) en base64
#   ANDROID_KEYSTORE_PASSWORD contraseña de la llave
#   ANDROID_KEY_ALIAS         alias de la llave
#   ANDROID_KEY_PASSWORD      contraseña del alias
# Se lanza a mano (Actions → Versión Google Play → Run workflow).
name: Versión Google Play
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Comprobar secretos
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KSP KA KP; do
            if [ -z "${!v}" ]; then echo "::error::Falta un secreto de la llave de firma. Revisa Settings → Secrets and variables → Actions."; exit 1; fi
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: node scripts/build-packs.mjs
      - run: npx cap add android
      - run: npx capacitor-assets generate --android
      - run: node scripts/native-setup.mjs
      - run: npx cap sync android
      - name: Compilar
        run: cd android && ./gradlew bundleRelease
      - name: Firmar
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KSP" -keypass "$KP" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KA"
          jarsigner -verify "$AAB" | tail -1
          mkdir -p dist && cp "$AAB" "dist/ecos-al-reves-$(node -p "require('./package.json').version")-$VERSION_CODE.aab"
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: ecos-al-reves-google-play
          path: dist/*.aab
