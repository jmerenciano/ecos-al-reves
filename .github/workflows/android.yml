# Genera un APK de Android de prueba (debug) que puedes descargar desde
# la pestaña Actions del repositorio e instalar en el móvil.
name: APK Android
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: node scripts/build-packs.mjs
      - run: npx cap add android
      - run: node scripts/native-setup.mjs
      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ecos-al-reves-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
